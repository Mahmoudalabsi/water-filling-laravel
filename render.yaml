services:
  - type: web
    name: water-filling-laravel
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: تعبئة المياه
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: water-filling-db
          property: externalConnectionString
  - type: pserv
    name: water-filling-db
    plan: free
    region: oregon
    ipAllowList: [] # allow all (Render's DB is internal-only)
