# Fly.io configuration for Laravel water-filling app
# Documentation: https://fly.io/docs/reference/configuration/

app = "water-filling-laravel"
primary_region = "ams"

# Build settings: use Dockerfile in root, no buildpack
[build]
  dockerfile = "Dockerfile"

# Environment variables (set at runtime)
[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/data/database.sqlite"
  SESSION_DRIVER = "file"
  CACHE_DRIVER = "file"
  LOG_CHANNEL = "stderr"
  APACHE_DOCUMENT_ROOT = "/var/www/html/public"

# HTTP service
[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Persistent volume for SQLite database
[[mounts]]
  source = "water_data"
  destination = "/data"

# Machine config: shared CPU, 512MB RAM (enough for Laravel + Apache + SQLite)
[[vm]]
  size = "shared-cpu-1x"
  memory = 512
